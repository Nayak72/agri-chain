version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agri-chain-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=agri_chain
    healthcheck:
      test: >-
        mongosh --quiet mongodb://localhost:27017/admin --eval
        'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agri-chain-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri-chain-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/agri_chain?replicaSet=rs0&directConnection=true
      - DATABASE_NAME=agri_chain
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000
      - UPLOAD_DIRECTORY=uploads
      - SIMULATOR_ENABLED=${SIMULATOR_ENABLED:-true}
      - LEDGER_CHAIN_ID=AGRCHAIN-GLOBAL-001
      - APP_ENV=development
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agri-chain-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agri-chain-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - backend
    networks:
      - agri-chain-network

volumes:
  mongodb_data:

networks:
  agri-chain-network:
    driver: bridge
