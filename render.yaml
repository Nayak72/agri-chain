services:
  - type: web
    name: agrichain-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: agri_chain_demo
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_STANDALONE_DEV
        value: "false"
      - key: UPLOAD_DIRECTORY
        value: uploads
      - key: LOG_LEVEL
        value: INFO

